services:
  - type: web
    name: kaylaandvaughn
    env: node
    plan: starter          # persistent disk requires at least the Starter plan
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true        # Render auto-generates a secure random value on first deploy
      - key: DASHBOARD_PASSWORD
        sync: false                # Set this manually in the Render dashboard — never put it in source
      - key: SQLITE_PATH
        value: /data/wedding.db
