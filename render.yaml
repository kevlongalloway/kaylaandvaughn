services:
  - type: web
    name: kaylaandvaughn
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true        # Render auto-generates a secure random value on first deploy
      - key: DASHBOARD_PASSWORD
        sync: false                # Set this manually in the Render dashboard — never put it in source
      - key: DATABASE_URL
        fromDatabase:
          name: kaylaandvaughn-db
          property: connectionString

databases:
  - name: kaylaandvaughn-db
    plan: free
    databaseName: wedding
    user: wedding_admin
